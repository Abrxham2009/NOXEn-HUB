<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mi espacio de estudio</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=Inter:wght@400;500;600&family=VT323&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef2f6;--card:#fff;--ink:#12263a;--mut:#5b6b7c;--line:#dbe3eb;--acc:#0f766e;--acc2:#e8f5f3;--hot:#f59e0b;--bad:#dc2626;color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0e1620;--card:#162331;--ink:#e8eef4;--mut:#93a4b5;--line:#25384a;--acc:#2dd4bf;--acc2:#12312f;--hot:#fbbf24;--bad:#f87171;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 Inter,system-ui,sans-serif}
h1,h2,h3{font-family:'Bricolage Grotesque',Inter,sans-serif;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--hot);outline-offset:2px}
.hidden{display:none!important}
.btn{background:var(--acc);color:#fff;border:0;border-radius:10px;padding:.6rem 1.1rem;font-weight:600}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]) .btn{color:#06201d}}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.sm{padding:.3rem .7rem;font-size:.85rem}
input,select,textarea{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:.6rem .8rem;width:100%}
label{font-size:.85rem;font-weight:600;color:var(--mut);display:block;margin-bottom:.25rem}
/* registro */
#reg{min-height:100vh;display:grid;place-items:center;padding:1.5rem}
.regbox{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:2rem;width:100%;max-width:420px;display:grid;gap:1rem}
.regbox h1{font-size:2rem;line-height:1.1}
.regbox p{margin:0;color:var(--mut)}
/* cabecera */
header{background:var(--acc);color:#fff;padding:1.4rem 1.2rem 1rem}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]) header{background:#0b2a2d;color:#e8eef4}}
.hwrap{max-width:1000px;margin:auto;display:flex;justify-content:space-between;align-items:flex-start;gap:1rem;flex-wrap:wrap}
#uname{font-size:clamp(2rem,6vw,3.2rem);font-weight:800;line-height:1.05;word-break:break-word}
#uschool{font-size:.9rem;opacity:.85;margin-top:.2rem}
.hbtn{display:flex;gap:.5rem;flex-wrap:wrap}
.hbtn .btn{background:rgba(255,255,255,.16);color:inherit}
nav{max-width:1000px;margin:1rem auto 0;display:flex;gap:.4rem;overflow-x:auto;padding-bottom:.2rem}
nav button{background:transparent;border:0;color:inherit;opacity:.8;padding:.5rem .9rem;border-radius:999px;white-space:nowrap;font-weight:500}
nav button.on{background:var(--card);color:var(--ink);opacity:1;font-weight:600}
main{max-width:1000px;margin:1.2rem auto;padding:0 1rem 3rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:1.1rem}
.grid{display:grid;gap:1rem;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.row{display:flex;gap:.6rem;flex-wrap:wrap;align-items:end}
.row>*{flex:1 1 140px}
.row>.btn{flex:0 0 auto}
.big{font-family:'Bricolage Grotesque';font-size:2.4rem;font-weight:800;line-height:1}
.mut{color:var(--mut);font-size:.9rem}
.bar{height:10px;background:var(--line);border-radius:99px;overflow:hidden;margin:.5rem 0}
.bar i{display:block;height:100%;background:var(--acc);transition:width .4s}
.item{display:flex;align-items:center;gap:.7rem;padding:.65rem 0;border-bottom:1px solid var(--line)}
.item:last-child{border:0}
.item .t{flex:1;min-width:0}
.item.done .t b{text-decoration:line-through;color:var(--mut)}
.item input[type=checkbox]{width:20px;height:20px;accent-color:var(--acc)}
.tag{font-size:.75rem;padding:.1rem .5rem;border-radius:99px;background:var(--acc2);color:var(--acc);font-weight:600}
.tag.alta{background:#fee2e2;color:#b91c1c}.tag.media{background:#fef3c7;color:#92400e}
.x{background:none;border:0;color:var(--mut);font-size:1.2rem}
.x:hover{color:var(--bad)}
h2{font-size:1.5rem;margin-bottom:.8rem}
h3{font-size:1.1rem;margin-bottom:.6rem}
.stack{display:grid;gap:1rem}
/* horario */
.hor{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:600px}
th,td{border:1px solid var(--line);padding:2px}
th{font-size:.85rem;padding:.4rem;background:var(--acc2);color:var(--acc)}
td input{border:0;border-radius:6px;padding:.4rem;font-size:.85rem;background:transparent}
td.h{font-size:.8rem;color:var(--mut);text-align:center;width:60px}
/* notas */
.notes{display:grid;grid-template-columns:240px 1fr;gap:1rem}
@media(max-width:700px){.notes{grid-template-columns:1fr}}
.nl button{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:.6rem .4rem}
.nl button.on{background:var(--acc2);font-weight:600}
textarea{min-height:320px;resize:vertical}
/* tarjetas */
.flip{min-height:200px;display:grid;place-items:center;text-align:center;font-size:1.3rem;font-family:'Bricolage Grotesque';padding:1.5rem;cursor:pointer;background:var(--acc2);border:2px dashed var(--acc);border-radius:16px}
/* pomodoro */
.time{font-family:'Bricolage Grotesque';font-weight:800;font-size:clamp(4rem,16vw,7rem);text-align:center;line-height:1;font-variant-numeric:tabular-nums}
.center{display:flex;justify-content:center;gap:.6rem;flex-wrap:wrap;margin-top:1rem}
.toast{position:fixed;bottom:1rem;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:.6rem 1.1rem;border-radius:10px;z-index:9}
:root[data-theme=dark]{--bg:#0e1620;--card:#162331;--ink:#e8eef4;--mut:#93a4b5;--line:#25384a;--acc:#2dd4bf;--acc2:#12312f;--hot:#fbbf24;--bad:#f87171;color-scheme:dark}
:root[data-theme=dark] header{background:#0b2a2d;color:#e8eef4}
:root[data-theme=dark] .btn{color:#06201d}
:root:root .btn.ghost{color:var(--ink)}
:root:root .hbtn .btn{color:inherit}
header{background-image:linear-gradient(135deg,rgba(255,255,255,.14),transparent 60%)}
.card{transition:transform .2s,box-shadow .2s}.card:hover{box-shadow:0 8px 24px rgba(0,0,0,.1);transform:translateY(-2px)}
.quote{margin:0 0 1rem;padding:.9rem 1.1rem;border-left:4px solid var(--hot);background:var(--card);border-radius:0 12px 12px 0;font-style:italic}
.chart{display:flex;align-items:flex-end;gap:.5rem;height:100px}
.chart div{flex:1;text-align:center;font-size:.75rem;color:var(--mut)}
.chart i{display:block;background:var(--acc);border-radius:6px 6px 0 0;min-height:3px;margin-bottom:3px}
.fx{position:fixed;top:-2.5rem;z-index:99;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(115vh) rotate(360deg)}}
body{background:radial-gradient(900px 500px at 8% -10%,rgba(15,118,110,.2),transparent),radial-gradient(800px 500px at 100% 0,rgba(99,102,241,.18),transparent),var(--bg) fixed}
header{background-image:linear-gradient(120deg,rgba(14,116,144,0),rgba(91,33,182,.55));box-shadow:0 6px 24px rgba(0,0,0,.18);border-radius:0 0 24px 24px}
#uname{text-shadow:0 2px 12px rgba(0,0,0,.25)}
nav button{transition:all .2s}nav button:hover{opacity:1;background:rgba(255,255,255,.16)}nav button.on,nav button.on:hover{background:var(--card);box-shadow:0 4px 12px rgba(0,0,0,.2);transform:translateY(-1px)}
.btn{transition:transform .12s,filter .2s,box-shadow .2s;box-shadow:0 3px 10px rgba(15,118,110,.25)}.btn:hover{filter:brightness(1.1);transform:translateY(-1px)}.btn:active{transform:scale(.95)}.btn.ghost{box-shadow:none}
.card{border-radius:18px;box-shadow:0 2px 10px rgba(0,0,0,.05)}
.grid>.card:nth-child(4n+1){border-top:4px solid var(--acc)}.grid>.card:nth-child(4n+2){border-top:4px solid var(--hot)}.grid>.card:nth-child(4n+3){border-top:4px solid #8b5cf6}.grid>.card:nth-child(4n){border-top:4px solid #ec4899}
.big{background:linear-gradient(90deg,var(--acc),#6366f1);-webkit-background-clip:text;background-clip:text;color:transparent}
.bar i{background:linear-gradient(90deg,var(--acc),#6366f1)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 3px var(--acc2)}
.item{transition:background .2s}.item:hover{background:var(--acc2);border-radius:10px}
.regbox{box-shadow:0 20px 60px rgba(0,0,0,.15);animation:up .5s}
td.h{width:100px;white-space:nowrap}
.fade{animation:up .35s}
@keyframes up{from{opacity:0;transform:translateY(10px)}}
.pk{position:fixed;inset:0;z-index:200;background:rgba(10,0,0,.93) repeating-linear-gradient(0deg,rgba(255,0,0,.07) 0 2px,transparent 2px 4px);display:grid;place-items:center;padding:1rem;animation:fi .3s}
.pk.bad{animation:flash .5s steps(2) 6}
.pkb{background:#140404;border:2px solid #ef4444;border-radius:14px;padding:1.4rem;max-width:460px;width:100%;color:#fecaca;font-family:ui-monospace,monospace;box-shadow:0 0 40px #ef4444aa}
.pk.bad .pkb{animation:shake .4s 8}
.pkh{color:#ef4444;font-weight:800;margin-bottom:.8rem;letter-spacing:.05em}
.pkl{min-height:5.5rem;font-size:.85rem;margin-bottom:.6rem}
.pkt{margin:1rem 0;font-size:1.15rem;line-height:1.4;color:#fff}
.pkt .m{display:block;margin-top:.8rem;font-size:.9rem;color:#86efac}
@keyframes flash{50%{background-color:rgba(130,0,0,.97)}}
@keyframes shake{0%,100%{transform:translate(0)}25%{transform:translate(-4px,2px)}50%{transform:translate(4px,-2px)}75%{transform:translate(-2px,-4px)}}
@keyframes fi{from{opacity:0}}
#secret{position:fixed;right:1rem;bottom:1rem;z-index:90;width:50px;height:50px;border-radius:50%;border:0;font-size:1.5rem;background:var(--card);box-shadow:0 4px 16px rgba(0,0,0,.3);animation:bob 1.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px) rotate(8deg)}}
.pk2{position:fixed;inset:0;z-index:150;background:rgba(0,0,0,.55);display:grid;place-items:center;padding:1rem;animation:fi .2s}
.pkc{background:var(--card);color:var(--ink);border-radius:18px;padding:1.3rem;max-width:460px;width:100%;max-height:90vh;overflow:auto}
.skg{display:grid;grid-template-columns:1fr 1fr;gap:.6rem;margin-top:.8rem}
.sk{background:var(--bg);color:var(--ink);border:2px solid var(--line);border-radius:12px;padding:.7rem;display:grid;gap:.4rem;text-align:left;font-weight:600;transition:transform .12s}
.sk:hover{transform:translateY(-2px)}.sk.on{border-color:var(--acc);box-shadow:0 0 0 3px var(--acc2)}
.sw{display:flex;gap:4px}.sw i{width:22px;height:22px;border-radius:6px;border:1px solid rgba(0,0,0,.2)}
:root[data-skin=oceano]{--bg:#e6f4fa;--card:#fff;--ink:#0b2a3c;--mut:#51697a;--line:#cfe3ee;--acc:#0369a1;--acc2:#e0f2fe;--hot:#f59e0b}
:root[data-skin=oceano] header{background:linear-gradient(120deg,#0369a1,#0891b2)}
:root[data-skin=atardecer]{--bg:#fff4ec;--card:#fff;--ink:#3a1f1a;--mut:#7a5a52;--line:#f1d9cb;--acc:#ea580c;--acc2:#ffedd5;--hot:#db2777}
:root[data-skin=atardecer] header{background:linear-gradient(120deg,#f97316,#db2777)}
:root[data-skin=rosa]{--bg:#fff0f6;--card:#fff;--ink:#4a1830;--mut:#8a5a72;--line:#f6d3e3;--acc:#db2777;--acc2:#fce7f3;--hot:#8b5cf6}
:root[data-skin=rosa] header{background:linear-gradient(120deg,#ec4899,#a855f7)}
:root[data-skin=espacio]{--bg:#0b0720;--card:#171237;--ink:#ece8ff;--mut:#a79ccf;--line:#2e2760;--acc:#a78bfa;--acc2:#251d54;--hot:#22d3ee;--bad:#fb7185;color-scheme:dark}
:root[data-skin=espacio] body{background:radial-gradient(1px 1px at 20% 30%,#fff,transparent),radial-gradient(1px 1px at 70% 60%,#fff,transparent),radial-gradient(2px 2px at 40% 80%,#c4b5fd,transparent),radial-gradient(1px 1px at 90% 15%,#fff,transparent),#0b0720;background-size:260px 260px;background-attachment:fixed}
:root[data-skin=espacio] header{background:linear-gradient(120deg,#312e81,#6d28d9)}
:root[data-skin=espacio] .btn{color:#0b0720}
:root[data-skin=minecraft]{--bg:#6b4a2b;--card:#c6c6c6;--ink:#1e1e1e;--mut:#4a4a4a;--line:#373737;--acc:#3d7a14;--acc2:#dcecc8;--hot:#f2c200;--bad:#b91c1c;color-scheme:light}
:root[data-skin=minecraft] body{font-family:VT323,monospace;font-size:21px;background:conic-gradient(#6b4a2b 25%,#5d3f24 0 50%,#6b4a2b 0 75%,#5d3f24 0) 0 0/56px 56px}
:root[data-skin=minecraft] :is(h1,h2,h3,#uname,.big,.time){font-family:'Press Start 2P',monospace;line-height:1.35}
:root[data-skin=minecraft] h2{font-size:1.05rem}:root[data-skin=minecraft] h3{font-size:.85rem}:root[data-skin=minecraft] .big{font-size:1.5rem;background:none;color:#3d7a14}
:root[data-skin=minecraft] #uname{font-size:clamp(1.2rem,4.5vw,1.9rem)}:root[data-skin=minecraft] .regbox h1{font-size:1.1rem}:root[data-skin=minecraft] .time{font-size:clamp(2.2rem,10vw,4.5rem)}
:root[data-skin=minecraft] main h2{color:#fff;text-shadow:3px 3px 0 #1e1e1e}:root[data-skin=minecraft] main>p.mut{color:#f1e6d6}
:root[data-skin=minecraft] header{background:#4f8a1e;border-radius:0;border-bottom:10px solid #6b4a2b;box-shadow:none}
:root[data-skin=minecraft] :is(.card,.regbox,.pkc,.sk,input,select,textarea,.btn,.flip,.quote,.tag,.toast,nav button,.bar,.bar i,.chart i,.item,.sw i,.grid>.card){border-radius:0}
:root[data-skin=minecraft] :is(.card,.regbox,.pkc,.grid>.card){border:3px solid #1e1e1e;box-shadow:inset 3px 3px 0 #fff,inset -3px -3px 0 #7a7a7a}
:root[data-skin=minecraft] .card:hover{transform:none}
:root[data-skin=minecraft] :is(input,select,textarea){background:#fff;color:#1e1e1e;border:3px solid #373737}
:root[data-skin=minecraft] .btn{background:#5b8c2a;color:#fff;border:3px solid #1e1e1e;text-shadow:2px 2px 0 #1e1e1e;box-shadow:inset 3px 3px 0 rgba(255,255,255,.4),inset -3px -3px 0 rgba(0,0,0,.4)}
:root[data-skin=minecraft] .btn.ghost{background:#a8a8a8;text-shadow:none}
:root[data-skin=minecraft] .hbtn .btn{background:#6b4a2b}
:root[data-skin=minecraft] .bar{border:2px solid #1e1e1e;background:#555}:root[data-skin=minecraft] .bar i,:root[data-skin=minecraft] .chart i{background:#5bd43a}
:root[data-skin=minecraft] .sk{background:#a8a8a8;border:3px solid #1e1e1e}:root[data-skin=minecraft] .sk.on{background:#dcecc8}
.bd{background:var(--hot);color:#1b1b1b;border-radius:99px;padding:0 .45rem;font-size:.75rem;margin-left:.2rem}
footer{text-align:center;padding:1.2rem;color:var(--mut);font-size:.85rem}
:root[data-skin=hacker] body,:root[data-skin=ambar] body,:root[data-skin=gameboy] body{font-family:VT323,monospace;font-size:21px}
:root[data-skin=hacker] :is(.card,.regbox,.pkc){border-color:#22ff66;box-shadow:0 0 12px rgba(34,255,102,.25)}
:root[data-skin=arcade] :is(h1,h2,h3,#uname,.big,.time){font-family:'Press Start 2P',monospace;line-height:1.35}
:root[data-skin=arcade] h2{font-size:1.05rem}:root[data-skin=arcade] h3{font-size:.85rem}:root[data-skin=arcade] .big{font-size:1.5rem}:root[data-skin=arcade] #uname{font-size:clamp(1.2rem,4.5vw,1.9rem)}:root[data-skin=arcade] .time{font-size:clamp(2.2rem,10vw,4.5rem)}
:root[data-skin=arcade] .card{border-color:#ff2e97;box-shadow:0 0 14px rgba(255,46,151,.3)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin:1rem 0 .5rem}
.ch{text-align:center;font-weight:700;color:var(--mut);font-size:.8rem}
.cd{min-height:80px;border:1px solid var(--line);border-radius:10px;padding:4px;font-size:.75rem;overflow:hidden}
.cd.tdy{border-color:var(--acc);background:var(--acc2)}
.ce{font-size:.68rem;padding:1px 4px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#sg{position:fixed;left:6px;bottom:6px;width:22px;height:22px;border:0;border-radius:5px;background:var(--acc);opacity:.12;z-index:80;padding:0;transition:opacity .2s}#sg:hover{opacity:.9}
.sb{position:fixed;inset:0;display:grid;place-items:center;z-index:120;pointer-events:none;padding:1rem}.sb div{background:var(--card);color:var(--ink);padding:1.2rem 1.6rem;border-radius:18px;border:3px solid var(--hot);font:800 clamp(1.2rem,4.5vw,2rem)/1.3 'Bricolage Grotesque',sans-serif;text-align:center;max-width:90vw;box-shadow:0 12px 40px rgba(0,0,0,.35);animation:pop .5s}
@keyframes pop{from{transform:scale(.3) rotate(-8deg);opacity:0}}
:root[data-skin=invalido] body{background:radial-gradient(900px 520px at 8% -10%,rgba(240,106,26,.3),transparent),radial-gradient(800px 500px at 100% 0,rgba(252,196,25,.16),transparent),radial-gradient(700px 400px at 50% 110%,rgba(240,106,26,.14),transparent),#0d0a0f fixed}
:root[data-skin=invalido] header{background:linear-gradient(120deg,#3b1204,#b8420a 70%,#d97706);box-shadow:0 8px 30px rgba(240,106,26,.35)}
:root[data-skin=invalido] :is(.big,#uname){background:linear-gradient(90deg,#f06a1a,#fcc419);-webkit-background-clip:text;background-clip:text;color:transparent}
:root[data-skin=invalido] .bar i,:root[data-skin=invalido] .chart i{background:linear-gradient(90deg,#f06a1a,#fcc419)}
:root[data-skin=invalido] .card{border-color:#4a2c18;box-shadow:0 2px 14px rgba(240,106,26,.12)}

:root[data-skin=invalido] h2::after{content:' 🎸';font-size:.8em}

.ipt{margin-top:.8rem;font:800 clamp(1.7rem,7vw,2.5rem)/1.1 'Bricolage Grotesque',sans-serif;background:linear-gradient(90deg,#f06a1a,#fcc419,#f06a1a);-webkit-background-clip:text;background-clip:text;color:transparent}

.ipb{display:flex;gap:.6rem;justify-content:center;flex-wrap:wrap}
.ipc .btn{background:linear-gradient(90deg,#f06a1a,#fcc419);color:#1a0d05;text-shadow:none}

<body>

<section id="reg" class="hidden">
  <form class="regbox" id="regForm">
    <h1>Empieza a estudiar mejor</h1>
    <p>Sin correos ni cuentas. Con tu nombre, instituto y clave recuperas tus datos en cualquier dispositivo.</p>
    <div><label for="rn">Tu nombre</label><input id="rn" required maxlength="40" autocomplete="given-name"></div>
    <div><label for="rs">Tu colegio o instituto</label><input id="rs" required maxlength="60"></div>
    <div><label for="rp">Tu clave (mínimo 4 caracteres)</label><input id="rp" type="password" minlength="4" required autocomplete="off"></div>
    <button class="btn" type="submit">Entrar</button>
  </form>
</section>

<section id="app" class="hidden">
  <header>
    <div class="hwrap">
      <div><div id="uname"></div><div id="uschool"></div><div id="st" style="font-size:.75rem;opacity:.75;margin-top:.3rem"></div></div>
      <div class="hbtn">
        <button class="btn sm" id="bSn">🔊</button>
        <button class="btn sm" id="bTh">🎨 Tema</button>
        <button class="btn sm" id="bExp">Guardar copia</button>
        <button class="btn sm" id="bImp">Cargar copia</button>

<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
// ⬇️ PEGA AQUÍ LOS DOS DATOS DE TU FIREBASE (apiKey y projectId)
const FB={apiKey:'AIzaSyBRKQaM76jFUjGAIsClUANyN3LkV1k__LQ',projectId:'estudiarsinmas'};
const KEY='estudio_v1';
const blank=()=>({user:null,tasks:[],exams:[],notes:[],cards:[],sched:{},pomo:{}});
let S;
try{S=Object.assign(blank(),JSON.parse(localStorage.getItem(KEY)||'{}'))}catch(e){S=blank()}
const save=()=>{S.ts=Date.now();try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast('No se pudo guardar. Usa "Guardar copia".')}push()};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const today=()=>new Date().toISOString().slice(0,10);
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.append(t);setTimeout(()=>t.remove(),2500)}
const TABS=[['inicio','🏠 Inicio'],['tareas','✅ Tareas'],['horario','🗓️ Horario'],['examenes','📝 Exámenes'],['apuntes','📒 Apuntes'],['tarjetas','🃏 Tarjetas'],['pomo','🍅 Pomodoro'],['calendario','📅 Calendario'],['extras','🧰 Extras'],['creditos','💜 Créditos']];
let tab='inicio',noteId=null,cardIdx=0,showBack=false,filt='pend';
const days=['Lunes','Martes','Miércoles','Jueves','Viernes'];
const hours=['8:15–9:15','9:15–10:15','10:15–11:15','11:45–12:45','12:45–13:45','13:45–14:45'];

function boot(){
  applySkin();sec();$('#bSn').textContent=S.mute?'🔇':'🔊';
  if(!S.user){$('#reg').classList.remove('hidden');$('#app').classList.add('hidden');return}
  $('#reg').classList.add('hidden');$('#app').classList.remove('hidden');
  mark();setSt(cloud()?'☁️ Sincronización activa':'💾 Solo en este dispositivo');$('#uname').textContent=S.user.name;$('#uschool').textContent=S.user.school;
  document.title=S.user.name+' · Estudio';
  $('#nav').innerHTML=TABS.map(([k,l])=>`<button data-t="${k}" class="${k===tab?'on':''}">${l}${k==='tareas'&&S.tasks.some(t=>!t.done)?` <b class="bd">${S.tasks.filter(t=>!t.done).length}</b>`:''}</button>`).join('');
  render();
}
$('#regForm').onsubmit=async e=>{e.preventDefault();const name=$('#rn').value.trim(),school=$('#rs').value.trim();
 if(cloud()){try{const nid=await sha(name.toLowerCase()+'|'+school.toLowerCase()+'|'+$('#rp').value);const d=await pull();
  if(d){S=Object.assign(blank(),d);toast('Datos recuperados de la nube ☁️')}else if(S.id&&S.id!==nid)S=blank();S.id=nid}catch(x){toast('No pude conectar con la nube')}}
 S.user={name,school};save();boot();if(aroa()){fx(H,1000);toast('Hola Aroa 💖')}if(simon(name))inval()};
$('#nav').onclick=e=>{const b=e.target.closest('button');if(b){tab=b.dataset.t;boot();const v=$('#view');v.classList.remove('fade');void v.offsetWidth;v.classList.add('fade')}};
$('#bOut').onclick=()=>{$('#rn').value=S.user.name;$('#rs').value=S.user.school;S.user=null;boot()};
$('#bExp').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:'application/json'}));a.download='copia-estudio-'+today()+'.json';a.click()};
$('#bImp').onclick=()=>$('#fImp').click();
$('#fImp').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{S=Object.assign(blank(),JSON.parse(r.result));save();boot();toast('Copia cargada')}catch(x){toast('Archivo no válido')}};r.readAsText(f)};

function render(){({inicio,tareas,horario,examenes,apuntes,tarjetas,pomo,calendario,extras,creditos})[tab]()}
const V=h=>$('#view').innerHTML=h;
const daysTo=d=>Math.round((new Date(d+'T00:00')-new Date(today()+'T00:00'))/864e5);

/* INICIO */
function inicio(){
  const pend=S.tasks.filter(t=>!t.done),tot=S.tasks.length,pct=tot?Math.round(100*(tot-pend.length)/tot):0;
  const ex=S.exams.filter(e=>daysTo(e.date)>=0).sort((a,b)=>a.date.localeCompare(b.date))[0];
  const pm=(S.pomo[today()]||0);
  const xp=S.tasks.filter(t=>t.done).length*10+Object.values(S.pomo).reduce((a,b)=>a+b,0)*20,lvl=Math.floor(xp/100)+1;
  const rv=S.exams.map(e=>[e,daysTo(e.date)]).filter(x=>[7,3,1,0].includes(x[1])).map(([e,d])=>`<div class="item"><div class="t"><b>${esc(e.subject)}</b><div class="mut">${d===0?'¡Examen hoy!':'Examen en '+d+(d===1?' día':' días')+': toca repasar'}</div></div></div>`).join('')||'<p class="mut">Hoy no toca ningún repaso programado.</p>';
  const ag={};for(let i=0;i<7;i++){const d=new Date();d.setDate(d.getDate()-i);const lg=(S.log||{})[d.toISOString().slice(0,10)]||{};for(const k in lg)ag[k]=(ag[k]||0)+lg[k]}
  const mx=Math.max(1,...Object.values(ag)),sj=Object.entries(ag).sort((a,b)=>b[1]-a[1]).slice(0,5).map(([k,v])=>`<div style="margin:.5rem 0"><div style="display:flex;justify-content:space-between"><span>${esc(k)}</span><b>${v} min</b></div><div class="bar"><i style="width:${100*v/mx}%"></i></div></div>`).join('')||'<p class="mut">Usa el Pomodoro eligiendo asignatura y aquí verás tu tiempo.</p>';
  const Q=QS[Math.floor(Date.now()/864e5)%QS.length];
  const wk=[...Array(7)].map((_,i)=>{const d=new Date();d.setDate(d.getDate()-6+i);const n=S.pomo[d.toISOString().slice(0,10)]||0;return `<div><i style="height:${Math.min(n*12,70)}px"></i>${'DLMXJVS'[d.getDay()]}</div>`}).join('');
  const di=new Date().getDay()-1,hoy=di>=0&&di<5?hours.map((h,i)=>[h,S.sched[di+'-'+i]]).filter(x=>x[1]):[];
  V(`<h2>${greet()}, ${esc(S.user.name)} 👋</h2><blockquote class="quote">${Q}</blockquote><div class="grid">
  <div class="card"><div class="mut">Tareas pendientes</div><div class="big">${pend.length}</div><div class="bar"><i style="width:${pct}%"></i></div><div class="mut">${pct}% completado</div></div>
  <div class="card"><div class="mut">Próximo examen</div>${ex?`<div class="big">${daysTo(ex.date)===0?'Hoy':daysTo(ex.date)+' d'}</div><div>${esc(ex.subject)}</div>`:'<div class="mut" style="margin-top:.6rem">Sin exámenes. Añade uno en Exámenes.</div>'}</div>
  <div class="card"><div class="mut">Pomodoros hoy</div><div class="big">${pm}</div><div class="mut">${pm*25} min de enfoque</div></div>
  <div class="card"><div class="mut">Racha de estudio</div><div style="display:flex;align-items:center;gap:.5rem"><span style="font-size:2rem;line-height:1">🔥</span><span class="big">${streak()}</span></div><div class="mut">días seguidos</div></div>
  <div class="card"><div class="mut">Nivel ${lvl}</div><div class="big">${xp} XP</div><div class="bar"><i style="width:${xp%100}%"></i></div><div class="mut">Tareas y pomodoros suman puntos</div></div></div>
  <div class="card" style="margin-top:1rem"><h3>Pomodoros de la semana</h3><div class="chart">${wk}</div></div>
  <div class="grid" style="margin-top:1rem"><div class="card"><h3>🔁 Repasos de hoy</h3>${rv}</div><div class="card"><h3>⏱️ Tiempo por asignatura (7 días)</h3>${sj}</div></div>
  <div class="grid" style="margin-top:1rem">
  <div class="card"><h3>Hoy en clase</h3>${hoy.length?hoy.map(x=>`<div class="item"><span class="tag">${x[0]}</span><b>${esc(x[1])}</b></div>`).join(''):'<p class="mut">Nada en tu horario para hoy.</p>'}</div>
  <div class="card"><h3>Lo más urgente</h3>${pend.sort((a,b)=>(a.due||'9').localeCompare(b.due||'9')).slice(0,4).map(t=>`<div class="item"><div class="t"><b>${esc(t.text)}</b><div class="mut">${esc(t.subject||'')} ${t.due?'· '+t.due:''}</div></div></div>`).join('')||'<p class="mut">Todo al día. Buen trabajo.</p>'}</div></div>`);
}

/* TAREAS */
function tareas(){
  let l=S.tasks.filter(t=>filt==='all'||(filt==='pend')===!t.done);
  const ord={alta:0,media:1,baja:2};
  l.sort((a,b)=>(a.due||'9').localeCompare(b.due||'9')||ord[a.prio]-ord[b.prio]);
  V(`<h2>Tareas</h2><div class="card stack"><form class="row" id="tf">
  <div style="flex:3 1 220px"><label>Tarea</label><input id="tt" required></div>
  <div><label>Asignatura</label><input id="ts"></div>
  <div><label>Fecha límite</label><input type="date" id="td"></div>
  <div><label>Prioridad</label><select id="tp"><option value="media">Media</option><option value="alta">Alta</option><option value="baja">Baja</option></select></div>
  <button class="btn">Añadir</button></form>
  <div class="row" style="align-items:center">${[['pend','Pendientes'],['done','Hechas'],['all','Todas']].map(([k,n])=>`<button class="btn sm ${filt===k?'':'ghost'}" data-f="${k}">${n}</button>`).join('')}</div>
  <div>${l.map(t=>`<div class="item ${t.done?'done':''}"><input type="checkbox" data-c="${t.id}" ${t.done?'checked':''} aria-label="Hecha"><div class="t"><b>${esc(t.text)}</b><div class="mut">${esc(t.subject||'')} ${t.due?'· '+t.due:''}</div></div><span class="tag ${t.prio}">${t.prio}</span><button class="x" data-d="${t.id}" aria-label="Borrar">×</button></div>`).join('')||'<p class="mut">No hay tareas aquí. Añade la primera arriba.</p>'}</div></div>`);
  $('#tf').onsubmit=e=>{e.preventDefault();S.tasks.push({id:uid(),text:$('#tt').value,subject:$('#ts').value,due:$('#td').value,prio:$('#tp').value,done:false});save();render()};
    $('#view').onclick=e=>{const c=e.target.dataset;
    if(c.f){filt=c.f;render()}
    if(c.d){S.tasks=S.tasks.filter(t=>t.id!==c.d);save();render()}};
  $('#view').onchange=e=>{const id=e.target.dataset.c;if(id){S.tasks.find(t=>t.id===id).done=e.target.checked;save();if(e.target.checked)fx(['🎉','✨','⭐'],500);render()}};
}

/* HORARIO */
function horario(){
  V(`<h2>Horario semanal</h2><div class="card hor"><table><tr><th></th>${days.map(d=>`<th>${d}</th>`).join('')}</tr>
  ${hours.map((h,i)=>`${i===3?'<tr><td class="h">11:15–11:45</td><td colspan="5" style="text-align:center;background:var(--acc2);color:var(--acc);font-weight:600">☕ Recreo</td></tr>':''}<tr><td class="h">${h}</td>${days.map((d,j)=>`<td><input data-s="${j}-${i}" value="${esc(S.sched[j+'-'+i]||'')}" aria-label="${d} ${h}"></td>`).join('')}</tr>`).join('')}</table></div><p class="mut">Escribe la asignatura en cada hora. Se guarda solo.</p>`);
  $('#view').oninput=e=>{const k=e.target.dataset.s;if(k){S.sched[k]=e.target.value;save()}};
}

/* EXÁMENES */
const tp=e=>{const T=e.topics||[],n=T.filter(x=>x.d).length;return `<div class="bar" style="max-width:260px"><i style="width:${T.length?100*n/T.length:0}%"></i></div><div style="display:flex;flex-wrap:wrap;gap:.3rem;align-items:center">${T.map((x,i)=>`<button class="tag" data-e="${e.id}" data-i="${i}" style="border:0;cursor:pointer;${x.d?'text-decoration:line-through;opacity:.6':''}">${esc(x.t)}</button>`).join('')}<button class="tag" data-ae="${e.id}" style="border:0;cursor:pointer">＋ tema</button></div>`};
function examenes(){
  const g=S.exams.filter(e=>e.grade!==''&&e.grade!=null),avg=g.length?(g.reduce((a,e)=>a+ +e.grade,0)/g.length).toFixed(2):'–';
  V(`<h2>Exámenes y notas</h2><div class="grid"><div class="card stack"><h3>Añadir examen</h3><form class="stack" id="ef">
  <div><label>Asignatura</label><input id="es" required></div><div><label>Fecha</label><input type="date" id="ed" required></div>
  <div><label>Nota (si ya la tienes)</label><input type="number" step="0.01" min="0" max="10" id="eg"></div><button class="btn">Guardar</button></form>
  <div><div class="mut">Nota media</div><div class="big">${avg}</div></div></div>
  <div class="card"><h3>Calendario</h3>${[...S.exams].sort((a,b)=>a.date.localeCompare(b.date)).map(e=>{const d=daysTo(e.date);return `<div class="item"><div class="t"><b>${esc(e.subject)}</b><div class="mut">${e.date}${e.grade!==''&&e.grade!=null?' · Nota '+e.grade:''}</div>${tp(e)}</div><span class="tag ${d<0?'':d<=7?'alta':'media'}">${d<0?'pasado':d===0?'hoy':d+' días'}</span><button class="x" data-d="${e.id}" aria-label="Borrar">×</button></div>`}).join('')||'<p class="mut">Aún no has añadido exámenes.</p>'}</div></div>`);
  $('#ef').onsubmit=e=>{e.preventDefault();S.exams.push({id:uid(),subject:$('#es').value,date:$('#ed').value,grade:$('#eg').value});save();render()};
  $('#view').onclick=e=>{const c=e.target.dataset;
    if(c.d)S.exams=S.exams.filter(x=>x.id!==c.d);
    else if(c.ae){const t=prompt('Nombre del tema (por ejemplo: Tema 3)');if(!t)return;const x=S.exams.find(y=>y.id===c.ae);(x.topics=x.topics||[]).push({t:t.trim(),d:false})}
    else if(c.e){const x=S.exams.find(y=>y.id===c.e).topics[c.i];x.d=!x.d}
    else return;
    save();render()};
}

/* APUNTES */
function apuntes(){
  if(!noteId&&S.notes[0])noteId=S.notes[0].id;
  const n=S.notes.find(x=>x.id===noteId);
  V(`<h2>Apuntes</h2><div class="notes"><div class="card nl"><button class="btn sm" id="nn" style="margin-bottom:.5rem;width:100%;text-align:center">+ Nuevo apunte</button>${S.notes.map(x=>`<button data-n="${x.id}" class="${x.id===noteId?'on':''}">${esc(x.title||'Sin título')}</button>`).join('')}</div>
  <div class="card stack">${n?`<input id="nt" value="${esc(n.title)}" placeholder="Título" style="font-weight:700"><textarea id="nb" placeholder="Escribe tus apuntes...">${esc(n.body)}</textarea><button class="btn sm ghost" id="nd" style="justify-self:start">Borrar apunte</button>`:'<p class="mut">Crea tu primer apunte con el botón de la izquierda.</p>'}</div></div>`);
  $('#nn').onclick=()=>{const x={id:uid(),title:'',body:''};S.notes.unshift(x);noteId=x.id;save();render()};
  $('#view').onclick=e=>{const id=e.target.dataset.n;if(id){noteId=id;render()}};
  if(n){$('#nt').oninput=e=>{n.title=e.target.value;save()};$('#nb').oninput=e=>{n.body=e.target.value;save()};
    $('#nd').onclick=()=>{if(confirm('¿Borrar este apunte?')){S.notes=S.notes.filter(x=>x!==n);noteId=null;save();render()}}}
}

/* TARJETAS */
let curC=null;
function tarjetas(){
  const L=S.cards,dom=L.filter(c=>(c.k||0)>=3).length,c=L.find(x=>x.id===curC)||L[0];
  V(`<h2>Tarjetas de estudio</h2><div class="grid"><div class="card stack"><h3>Nueva tarjeta</h3><form class="stack" id="cf"><div><label>Pregunta</label><input id="cq" required></div><div><label>Respuesta</label><input id="ca" required></div><button class="btn">Añadir</button></form><div class="mut">${L.length} tarjetas · ${dom} dominadas</div><div class="bar"><i style="width:${L.length?100*dom/L.length:0}%"></i></div></div>
  <div class="card stack"><h3>Repasar</h3>${c?`<div class="flip" id="fl" tabindex="0">${esc(showBack?c.a:c.q)}</div><div class="mut" style="text-align:center">Toca la tarjeta para girarla</div>${showBack?`<div class="center" style="margin:0"><button class="btn ghost sm" id="no">😵 No la sabía</button><button class="btn sm" id="si">✅ La sabía</button></div>`:''}<div class="center" style="margin:0"><button class="btn ghost sm" id="dc">Borrar</button></div>`:'<p class="mut">Añade tarjetas para empezar. Las que falles te saldrán más veces.</p>'}</div></div>`);
  $('#cf').onsubmit=e=>{e.preventDefault();S.cards.push({id:uid(),q:$('#cq').value,a:$('#ca').value,k:0});save();render()};
  if(c){const fl=()=>{showBack=!showBack;render()};$('#fl').onclick=fl;$('#fl').onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();fl()}};
    const nxt=()=>{const m=Math.min(...L.map(x=>x.k||0)),p=L.filter(x=>(x.k||0)===m&&x.id!==c.id),q=p.length?p:L.filter(x=>x.id!==c.id);curC=(q.length?q[Math.floor(Math.random()*q.length)]:c).id;showBack=false;save();render()};
    if($('#si'))$('#si').onclick=()=>{c.k=(c.k||0)+1;fx(['⭐'],200);nxt()};
    if($('#no'))$('#no').onclick=()=>{c.k=0;nxt()};
    $('#dc').onclick=()=>{S.cards=S.cards.filter(x=>x!==c);curC=null;showBack=false;save();render()}}
}
/* POMODORO */
let pt=null,left=25*60,mode='foco',plen=1500;
function pomo(){
  const m=String(Math.floor(left/60)).padStart(2,'0'),s=String(left%60).padStart(2,'0');
  V(`<h2>Pomodoro</h2><div class="card"><div class="mut" style="text-align:center">${mode==='foco'?'Hora de concentrarte':'Descanso'}</div><div style="max-width:320px;margin:0 auto 1rem"><label>¿Qué estás estudiando?</label><input id="psub" list="subs" value="${esc(S.psub||'')}" placeholder="Matemáticas, Historia..."><datalist id="subs">${[...new Set([...Object.values(S.sched),...S.exams.map(e=>e.subject),...S.tasks.map(t=>t.subject)].filter(Boolean))].map(x=>`<option value="${esc(x)}">`).join('')}</datalist></div><div class="time" id="tm">${m}:${s}</div>
  <div class="center"><button class="btn" id="pg">${pt?'Pausar':'Empezar'}</button><button class="btn ghost" id="pr">Reiniciar</button><button class="btn ghost" id="p25">Foco 25</button><button class="btn ghost" id="p50">Foco 50</button><button class="btn ghost" id="p5">Descanso 5</button></div>
  <p class="mut" style="text-align:center;margin-top:1rem">Hoy: ${S.pomo[today()]||0} sesiones completadas</p></div>`);
  $('#psub').oninput=e=>{S.psub=e.target.value;save()};
  $('#pg').onclick=()=>{if(pt){clearInterval(pt);pt=null;pomo()}else{pt=setInterval(tick,1000);pomo()}};
  $('#pr').onclick=()=>{clearInterval(pt);pt=null;left=mode==='foco'?plen:300;pomo()};
  $('#p25').onclick=()=>{clearInterval(pt);pt=null;mode='foco';left=plen=1500;pomo()};
  $('#p50').onclick=()=>{clearInterval(pt);pt=null;mode='foco';left=plen=3000;pomo()};
  $('#p5').onclick=()=>{clearInterval(pt);pt=null;mode='descanso';left=300;pomo()};
}
function tick(){
  left--;const t=$('#tm');document.title=Math.floor(left/60)+':'+String(left%60).padStart(2,'0')+' · Estudio';
  if(t)t.textContent=String(Math.floor(left/60)).padStart(2,'0')+':'+String(left%60).padStart(2,'0');
  if(left<=0){clearInterval(pt);pt=null;if(mode==='foco'){S.pomo[today()]=(S.pomo[today()]||0)+1;S.log=S.log||{};const lg=S.log[today()]=S.log[today()]||{},sb=S.psub||'General';lg[sb]=(lg[sb]||0)+plen/60;save();mode='descanso';left=300}else{mode='foco';left=plen}
    toast('¡Tiempo! Cambia de fase.');beep();fx(['🍅','✨'],800);if(tab==='pomo')pomo()}
}
const QS=['Un pequeño paso cada día supera a un gran esfuerzo un solo día.','No tienes que ser perfecto, solo constante.','Estudiar hoy es regalarle tiempo a tu yo del futuro.','Empieza ahora: la motivación llega después.','Lo difícil de hoy será fácil mañana.','Descansar también es parte de estudiar.','Cada tarjeta repasada es un punto ganado.'];
const H=['❤️','💖','💗','💕'];
const aroa=()=>/^\s*aroa\s*$/i.test((S.user&&S.user.name)||'');
function fx(em,ms){const n=Math.round(ms/25);for(let i=0;i<n;i++)setTimeout(()=>{const s=document.createElement('span');s.className='fx';s.textContent=em[i%em.length];s.style.left=Math.random()*100+'vw';s.style.fontSize=(1+Math.random()*1.6)+'rem';s.style.animationDuration=(.8+Math.random()*.4)+'s';document.body.append(s);setTimeout(()=>s.remove(),1300)},i*25)}
function beep(){try{const a=new AudioContext(),o=a.createOscillator();o.connect(a.destination);o.frequency.value=880;o.start();o.stop(a.currentTime+.4)}catch(e){}}

 const c=$('#sc'),x=c.getContext('2d'),N=20,Z=20;

  x.clearRect(0,0,400,400);x.globalAlpha=.08;x.fillStyle=ink;for(let i=0;i<N;i++)for(let j=0;j<N;j++)if((i+j)%2)x.fillRect(i*Z,j*Z,Z,Z);x.globalAlpha=1;
